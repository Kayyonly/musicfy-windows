name: iOS CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test iOS Simulator
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Xcode and simulator availability
        run: |
          xcodebuild -version
          xcodebuild -list -project ios-app/MusicfyIOS.xcodeproj
          xcrun simctl list devices available

      - name: Build app and run XCTest
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios-app/MusicfyIOS.xcodeproj \
            -scheme MusicfyIOS \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/MusicfyDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MusicfyIOS.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/ios-xcodebuild.log"

      - name: Upload Xcode logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-results
          path: |
            ${{ runner.temp }}/ios-xcodebuild.log
            ${{ runner.temp }}/MusicfyIOS.xcresult
          if-no-files-found: ignore
          retention-days: 7
