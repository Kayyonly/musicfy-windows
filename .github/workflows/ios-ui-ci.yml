name: iOS UI prototype — manual review build

# Draft only. Publication and every manual run require owner approval.
# GitHub requires this file on the default branch before dispatch is available.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-ui:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
        working-directory: ios-app
    steps:
      - name: Checkout approved revision with minimum access
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          sparse-checkout: |
            ios-app
            .github/workflows/ios-ui-ci.yml
          sparse-checkout-cone-mode: false

      - name: Record preinstalled toolchain and simulator inventory
        run: |
          set -euo pipefail
          mkdir -p CI-output
          test -d "$DEVELOPER_DIR"
          {
            sw_vers
            xcodebuild -version
            xcrun swift --version
            xcodebuild -showsdks
          } 2>&1 | tee CI-output/toolchain.log
          xcrun simctl list devices available --json > CI-output/devices.json
          xcrun simctl list runtimes --json > CI-output/runtimes.json
          xcrun simctl list devicetypes --json > CI-output/device-types.json
          cat CI-output/devices.json
          cat CI-output/runtimes.json

      - name: Audit source membership and shared scheme offline
        run: |
          set -euo pipefail
          python3 CI/check_project.py | tee CI-output/static-project.log
          python3 -m unittest discover -s CI -p 'test_*.py' -v 2>&1 | tee CI-output/helper-tests.log

      - name: Validate project and scheme using Xcode
        run: |
          set -euo pipefail
          xcodebuild -list -json -project MusicfyIOS.xcodeproj \
            -disableAutomaticPackageResolution -skipPackageUpdates \
            > CI-output/project-list.json 2> CI-output/project-list.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path('CI-output/project-list.json').read_text())['project']
          assert {'MusicfyIOS', 'MusicfyIOSTests'} <= set(project['targets'])
          assert 'MusicfyIOS' in project['schemes']
          print('Xcode listed the required targets and shared scheme.')
          PY
          xcodebuild -showdestinations -project MusicfyIOS.xcodeproj -scheme MusicfyIOS \
            -disableAutomaticPackageResolution -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee CI-output/destinations.log
          python3 CI/select_destination.py \
            --devices CI-output/devices.json \
            --runtimes CI-output/runtimes.json \
            --device-types CI-output/device-types.json \
            --destinations CI-output/destinations.log \
            --github-env "$GITHUB_ENV" | tee CI-output/selected-destination.log

      - name: Build app and XCTest for the selected iPhone simulator
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project MusicfyIOS.xcodeproj -scheme MusicfyIOS -configuration Debug \
            -destination "$MUSICFY_DESTINATION" -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/MusicfyIOS-DerivedData" \
            -resultBundlePath CI-output/Build.xcresult \
            -disableAutomaticPackageResolution -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee CI-output/build.log

      - name: Run existing XCTest without rebuilding
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project MusicfyIOS.xcodeproj -scheme MusicfyIOS -configuration Debug \
            -destination "$MUSICFY_DESTINATION" -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/MusicfyIOS-DerivedData" \
            -resultBundlePath CI-output/Tests.xcresult \
            -parallel-testing-enabled NO \
            -disableAutomaticPackageResolution -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee CI-output/tests.log

      - name: Keep only short-lived build and test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ui-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ios-app/CI-output/*.log
            ios-app/CI-output/*.json
            ios-app/CI-output/*.xcresult
          if-no-files-found: ignore
          retention-days: 3
          include-hidden-files: false
